name: Run Checks

on: [push, pull_request]

jobs:
    Test:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - name: Fetch downgrade test baseline
              run: git fetch --no-tags --depth=1 origin 4818e7f4417b44a6c1645dce2ab64ae1aa5f054c
            - uses: actions/setup-node@v4
              with:
                  node-version: '20'
            - uses: oven-sh/setup-bun@v1
              with:
                  bun-version: 'latest'
            - name: Install modules
              run: bun install --frozen-lockfile
            - name: Run tests
              run: npm test
    Format:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: '20'
            - uses: oven-sh/setup-bun@v1
              with:
                  bun-version: 'latest'
            - name: Install modules
              run: bun install --frozen-lockfile
            - name: Check formatting
              run: npm run format:check
    Lint:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: '20'
            - uses: oven-sh/setup-bun@v1
              with:
                  bun-version: 'latest'
            - name: Install modules
              run: bun install --frozen-lockfile
            - name: Run linter
              run: npm run lint:check
